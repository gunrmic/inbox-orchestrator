name: CI

# Every push and pull request runs the full suite on macOS and Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, integration, e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit + integration with coverage thresholds
        run: npm run test:coverage
      - name: End to end (CLI and daemon as processes)
        run: npx vitest run --project e2e
      - name: Installer (real install.sh from this commit)
        run: npm run test:install
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  menubar:
    name: Menu bar app e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            menubar/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: menubar
      - name: Playwright + Electron (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
        working-directory: menubar
      - name: Playwright + Electron (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test
        working-directory: menubar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            menubar/playwright-report/
            menubar/test-results/
          if-no-files-found: ignore

  node-versions:
    name: Node ${{ matrix.node }} (Linux)
    strategy:
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
