name: Release

# Builds the standalone menu bar app (.dmg, daemon and CLI inside, no Node needed) on a Mac
# runner. Push a tag like v0.2.0 to publish a GitHub release, or run it by hand to get the
# .dmg as a workflow artifact.
#
# Signing and notarization are used when these repository secrets exist; without them the
# app is unsigned and macOS asks the user to open it with right click > Open the first time:
#   CSC_LINK, CSC_KEY_PASSWORD           Developer ID Application certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this version (e.g. 0.1.0). Leave empty to only build the .dmg."
        required: false

permissions:
  contents: write

# One job on one Mac: macOS runners queue for minutes, so the tests and the build share it.
jobs:
  dmg:
    name: Test on macOS and build the .dmg
    # A new Apple account's first notarizations can be held for a day or two; the default
    # 6-hour job limit would cut the wait short. (Self-hosted runners allow up to 5 days.)
    timeout-minutes: 2880
    # Your own Mac when the MAC_RUNNER repository variable names its label (no queue), else GitHub's.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            menubar/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Tests (unit, integration, CLI and daemon end to end)
        run: npm test
      - name: Menu bar app tests
        working-directory: menubar
        run: |
          npm ci
          npx playwright test
      - name: Build the app
        working-directory: menubar
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Not secret: the Apple account and team that sign. Override with repository secrets of the same name.
          APPLE_ID: ${{ secrets.APPLE_ID || 'omermic.om@gmail.com' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'VF3UX83GRZ' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # electron-builder treats an empty CSC_LINK as a path, so set it only when there is a certificate.
          if [ -n "$SECRET_CSC_LINK" ]; then
            # Add Apple's Developer ID G2 intermediate to the certificate bundle, so the identity is
            # valid on a Mac without Xcode (a self-hosted runner). Temp files only, removed after the job.
            WORK="$RUNNER_TEMP/signing"; mkdir -p "$WORK"; chmod 700 "$WORK"
            trap 'rm -rf "$WORK"' EXIT
            curl -fsSL -o "$WORK/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            # The system's LibreSSL writes a PKCS#12 that macOS `security` can read (OpenSSL 3 from Homebrew does not).
            OSSL=/usr/bin/openssl
            $OSSL x509 -inform DER -in "$WORK/g2.cer" -out "$WORK/g2.pem"
            $OSSL x509 -in "$WORK/g2.pem" -noout -subject | grep -q "Developer ID Certification Authority"
            printf '%s' "$SECRET_CSC_LINK" | base64 --decode > "$WORK/in.p12"
            export P12PASS="$SECRET_CSC_KEY_PASSWORD"
            $OSSL pkcs12 -in "$WORK/in.p12" -passin env:P12PASS -nodes -out "$WORK/all.pem"
            $OSSL pkcs12 -export -in "$WORK/all.pem" -certfile "$WORK/g2.pem" -passout env:P12PASS -out "$WORK/chain.p12"
            rm -f "$WORK/all.pem" "$WORK/in.p12"
            export CSC_LINK="$WORK/chain.p12" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            # Notarize only when the app-specific password is there; otherwise sign without it.
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || unset APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
            npm ci
            npm run dist
          else
            # No certificate: sign ad hoc. A completely unsigned app is reported as "damaged" on
            # Apple Silicon; an ad hoc signed one gets the usual "Open Anyway" in Privacy & Security.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm ci
            node ../scripts/stage-cli.mjs
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
          # Fail the release if the app inside the .dmg does not pass a signature check.
          ls -la ../build/dist
          test -f ../build/dist/latest-mac.yml
          # Its own mount folder per run; never left mounted, even when a step fails.
          MNT="$RUNNER_TEMP/ibo-dmg-$GITHUB_RUN_ID"
          cleanup() { pkill -f "$MNT/Inbox Orchestrator.app" 2>/dev/null || true; sleep 2; hdiutil detach -force "$MNT" >/dev/null 2>&1 || true; [ -z "${WORK:-}" ] || rm -rf "$WORK"; }
          trap cleanup EXIT
          hdiutil attach -nobrowse -mountpoint "$MNT" ../build/dist/Inbox-Orchestrator.dmg
          codesign --verify --deep --strict --verbose=2 "$MNT/Inbox Orchestrator.app"
          # Smoke test: the daemon inside the app starts on the app's own Node and answers.
          APP="$MNT/Inbox Orchestrator.app"
          export SMOKE_HOME="$(mktemp -d)"
          # A port of its own, so a runner Mac that already runs the agent is not disturbed.
          mkdir -p "$SMOKE_HOME/.ibo" && printf 'server:\n  port: 47899\n' > "$SMOKE_HOME/.ibo/settings.yaml"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Inbox Orchestrator" "$APP/Contents/Resources/cli/dist/cli.js" --version
          (cd "$SMOKE_HOME" && HOME="$SMOKE_HOME" IBO_HOME="$SMOKE_HOME/.ibo" IBO_SECRETS_BACKEND=file IBO_NO_AUTO_UPDATE=1 ELECTRON_RUN_AS_NODE=1 \
            "$APP/Contents/MacOS/Inbox Orchestrator" "$APP/Contents/Resources/cli/dist/cli.js" start > "$SMOKE_HOME/daemon.log" 2>&1 &)
          for i in $(seq 1 30); do [ -f "$SMOKE_HOME/.ibo/api-token" ] && curl -sf -H "authorization: Bearer $(cat "$SMOKE_HOME/.ibo/api-token")" http://127.0.0.1:47899/setup/status && break; sleep 1; done
          echo; cat "$SMOKE_HOME/daemon.log"
          curl -sf -H "authorization: Bearer $(cat "$SMOKE_HOME/.ibo/api-token")" http://127.0.0.1:47899/status
          # Stop the test agent and wait until it has exited, so the disk can be unmounted.
          pkill -f "$MNT/Inbox Orchestrator.app/Contents/Resources/cli/dist/cli.js start" || true
          for i in $(seq 1 20); do pgrep -f "$MNT/Inbox Orchestrator.app" >/dev/null || break; sleep 0.5; done
          spctl --assess --type execute --verbose=2 "$APP" || echo "Gatekeeper would block this build (not notarized)."
          hdiutil detach -force "$MNT"
          trap - EXIT
          [ -z "${WORK:-}" ] || rm -rf "$WORK"
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-orchestrator-dmg
          path: build/dist/*.dmg
      - name: Release name
        id: tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # A JavaScript action, so the runner needs no gh CLI (a self-hosted Mac may not have it).
      # The .dmg for new users; the zip, blockmaps and latest-mac.yml for the app's own updater.
      - name: Publish release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/dist/*.dmg
            build/dist/*.zip
            build/dist/*.blockmap
            build/dist/latest-mac.yml
