name: Release

# Builds the standalone menu bar app (.dmg, daemon and CLI inside, no Node needed) on a Mac
# runner. Push a tag like v0.2.0 to publish a GitHub release, or run it by hand to get the
# .dmg as a workflow artifact.
#
# Signing and notarization are used when these repository secrets exist; without them the
# app is unsigned and macOS asks the user to open it with right click > Open the first time:
#   CSC_LINK, CSC_KEY_PASSWORD           Developer ID Application certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-tests:
    uses: ./.github/workflows/macos.yml

  dmg:
    needs: macos-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the app
        working-directory: menubar
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder treats an empty CSC_LINK as a path, so set it only when there is a certificate.
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-orchestrator-dmg
          path: build/dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/dist/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
